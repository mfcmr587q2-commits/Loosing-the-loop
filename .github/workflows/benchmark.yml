name: controlled-benchmark

on:
  push:
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run benchmark assertions
        run: python -m unittest tests/test_benchmark.py -v
      - name: Run benchmark report
        run: python benchmarks/benchmark.py

  regression:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
